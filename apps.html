<style>
:root{--text:#111827;--muted:#6b7280;--light:#f5f7fa;--border:#e5e7eb;--blue:#2563eb;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:#fff;line-height:1.6}
a{text-decoration:none;color:inherit}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1100px;margin:auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:21px;font-weight:700}.brand span{color:var(--blue)}
.back{font-size:14px;color:var(--muted)}
.hero{max-width:900px;margin:auto;padding:68px 24px 42px;text-align:center}
.hero h1{margin:0 0 12px;font-size:clamp(36px,6vw,54px);line-height:1.1;letter-spacing:-1.8px}
.hero p{max-width:650px;margin:auto;color:var(--muted);font-size:18px}
.nav-wrap{max-width:1100px;margin:auto;padding:0 24px 30px}
.app-nav{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.app-nav a{flex:0 0 auto;background:var(--light);border:1px solid var(--border);border-radius:999px;padding:7px 13px;font-size:13px;color:#4b5563;white-space:nowrap}
.app-nav a:hover{background:#eff6ff;border-color:#bfdbfe;color:var(--blue)}
.apps{max-width:900px;margin:auto;padding:0 24px 80px}
.card{position:relative;display:grid;grid-template-columns:112px 1fr;gap:28px;padding:30px;margin-bottom:22px;border:1px solid var(--border);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.06);scroll-margin-top:100px}
.icon{width:112px;height:112px;border-radius:24px;object-fit:cover;background:var(--light);box-shadow:0 4px 14px rgba(0,0,0,.1)}
h2{margin:0 0 7px;font-size:25px;line-height:1.25;letter-spacing:-.5px}
.desc{margin:0 0 20px;color:var(--muted);font-size:15px;line-height:1.65}
.buttons{display:flex;flex-wrap:wrap;gap:10px}
.store{display:inline-flex;align-items:center;gap:9px;min-width:155px;padding:10px 15px;border-radius:9px;background:#050505;color:#fff;font-size:13px;font-weight:600}
.store:hover{opacity:.88}.store svg{width:21px;height:21px;flex:none}
.share{position:absolute;right:18px;top:17px;border:0;background:none;color:#9ca3af;cursor:pointer;font-size:13px}
.share:hover{color:var(--blue)}
footer{border-top:1px solid var(--border);text-align:center;padding:35px 24px;color:var(--muted);font-size:13px}
@media(max-width:650px){
.header-inner{padding:15px 18px}.hero{padding:50px 20px 35px}.hero h1{font-size:38px}
.nav-wrap{padding-left:18px;padding-right:18px}.apps{padding-left:16px;padding-right:16px}
.card{grid-template-columns:72px 1fr;gap:17px;padding:22px}.icon{width:72px;height:72px;border-radius:17px}
h2{font-size:20px;padding-right:20px}.desc{grid-column:1/-1;margin-top:-4px;margin-bottom:16px}.buttons{grid-column:1/-1}

const APPLE_ICON=`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.34 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.96-2.47 4.08zM12.03 7.25C11.88 5.02 13.69 3.18 15.72 3c.28 2.58-2.34 4.5-3.69 4.25z"/></svg>`;
const PLAY_ICON=`<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#34A853" d="M3.27 2.95 13.78 13.5 3.27 21.05C3.1 20.72 3 20.35 3 19.94V4.06c0-.41.1-.78.27-1.11z"/><path fill="#FBBC04" d="m14.5 14.22 2.68 2.68-10.55 5.98c-.53.3-1.02.25-1.42-.02L14.5 14.22z"/><path fill="#4285F4" d="m14.5 9.78 2.68-2.68-10.55-5.98c-.53-.3-1.02-.25-1.42.02L14.5 9.78z"/><path fill="#EA4335" d="m19.5 11.05-2.32-1.31-2.68 2.68 2.68 2.68 2.33-1.32c.87-.49.87-2.24-.01-2.73z"/></svg>`;

function render(){
 const nav=document.getElementById("appNav"), container=document.getElementById("apps");
 APPS.forEach(app=>{
   const n=document.createElement("a"); n.href="#"+app.slug; n.textContent=app.name; nav.appendChild(n);
   const card=document.createElement("article"); card.className="card"; card.id=app.slug;
   const buttons=[
     app.ios?`<a class="store" href="${app.ios}" target="_blank" rel="noopener">${APPLE_ICON}<span>App Store</span></a>`:"",
     app.android?`<a class="store" href="${app.android}" target="_blank" rel="noopener">${PLAY_ICON}<span>Google Play</span></a>`:""
   ].join("");
   card.innerHTML=`
     <img class="icon" id="icon-${app.slug}" src="${app.icon || FALLBACK_ICON}" alt="${app.name} icon" loading="lazy" onerror="this.onerror=null;this.src=FALLBACK_ICON">
     <div><h2>${app.name}</h2><p class="desc">${app.description}</p><div class="buttons">${buttons}</div></div>
     <button class="share" onclick="shareApp('${app.slug}','${app.name.replace(/'/g,"\\'")}')">Share</button>`;
   container.appendChild(card);

   // Apple-only entries: replace fallback with official App Store artwork.
   if(!app.icon && app.appleId) loadAppleArtwork(app);
 });
}

async function loadAppleArtwork(app){
 try{
   const r=await fetch(`https://itunes.apple.com/lookup?id=${encodeURIComponent(app.appleId)}&country=us`);
   if(!r.ok) return;
   const data=await r.json();
   const result=data.results && data.results[0];
   if(!result) return;
   const artwork=(result.artworkUrl512 || result.artworkUrl100 || "").replace(/100x100bb/,"512x512bb");
   if(artwork){
     const img=document.getElementById("icon-"+app.slug);
     if(img) img.src=artwork;
   }
 }catch(e){}
}

async function shareApp(slug,name){
 const url=location.origin+location.pathname+"#"+slug;
 if(navigator.share){try{await navigator.share({title:name,text:"Check out "+name,url});}catch(e){}}
 else{try{await navigator.clipboard.writeText(url);alert("App link copied to clipboard.");}catch(e){prompt("Copy this app link:",url);}}
}

render();
